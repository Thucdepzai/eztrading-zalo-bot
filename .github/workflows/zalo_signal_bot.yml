name: EZTrading AI Zalo Signal Bot (24/7)

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: eztrading-zalo-signal-bot
  cancel-in-progress: false

jobs:
  monitor-signals:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Signal Monitor Loop (50 minutes, 10s interval)
        env:
          GITHUB_ACTIONS: "true"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ZALO_BOT_TOKEN: ${{ secrets.ZALO_BOT_TOKEN }}
          ZALO_CHAT_ID: ${{ secrets.ZALO_CHAT_ID }}
          EZ_EMAIL: ${{ secrets.EZ_EMAIL }}
          EZ_PASSWORD: ${{ secrets.EZ_PASSWORD }}
          EZ_TOKEN: ${{ secrets.EZ_TOKEN }}
          POLL_INTERVAL: "10"
        run: python -u bot.py --cloud-loop 3000

      - name: Chain next 24/7 run seamlessly
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          curl -s -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GH_REPO/actions/workflows/zalo_signal_bot.yml/dispatches" \
            -d '{"ref":"main"}' || true
